<!DOCTYPE html>
<html lang="%lang%" data-theme="%theme%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="128x128" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12171c" media="(prefers-color-scheme: dark)" />
    <script data-ui5-config type="application/json">{ "theme": "%ui5-theme%", "language": "%ui5-lang%" }</script>
    <style>
      /* Horizon background before UI5 theme variables are loaded */
      html { background: #f5f6f7; }
      html[data-theme='dark'] { background: #12171c; }
      @media (prefers-color-scheme: dark) {
        html[data-theme='auto'] { background: #12171c; }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
